[package]
name = "ipdt"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = "4.5.23"
mlua = { version = "0.10.2", features = ["luau", "serialize"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
webpki-roots = "1.0.10"
rustls-webpki = "0.103.16"
rustpython = "0.4.0"
rustpython-stdlib = "0.4.0"
rustpython-vm = "0.4.0"
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
thiserror = "2.0.8"
tokio = "1.42.0"
